# Local production-like verification override (HTTP-only loopback on 127.0.0.1:8081 with isolated Postgres 16)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accommodation
      POSTGRES_PASSWORD: accommodation_local_verify
      POSTGRES_DB: campus_mobility_accommodation
    volumes:
      - accommodation_prod_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accommodation -d campus_mobility_accommodation"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - accommodation_prod_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    env_file: !override
      - .env.accommodation.local
    depends_on:
      db:
        condition: service_healthy

  backend:
    env_file: !override
      - .env.accommodation.local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    ports: !override
      - "127.0.0.1:8081:80"
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  accommodation_prod_local_pgdata:
