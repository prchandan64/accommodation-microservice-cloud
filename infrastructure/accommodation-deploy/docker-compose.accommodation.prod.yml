name: accommodation-prod

services:
  migrate:
    image: ${BACKEND_IMAGE:-accommodation-ms-backend}:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env.accommodation
        required: false
    restart: "no"
    networks:
      - accommodation_prod_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE:-accommodation-ms-backend}:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.accommodation
        required: false
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/accommodation/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - accommodation_prod_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:-accommodation-ms-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1/accommodation
    volumes:
      - ./nginx.accommodation.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - accommodation_prod_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - accommodation_prod_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  accommodation_prod_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
