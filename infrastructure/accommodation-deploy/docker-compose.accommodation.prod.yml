name: accommodation-prod

services:
  migrate:
    image: ${BACKEND_IMAGE:-prchandan6666/accommodation-backend}:${IMAGE_TAG:-v1.1.0}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env.accommodation
        required: false
    mem_limit: 512m
    restart: "no"
    networks:
      - accommodation_prod_net
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /accommodation/prod
        awslogs-stream: migrate

  backend:
    image: ${BACKEND_IMAGE:-prchandan6666/accommodation-backend}:${IMAGE_TAG:-v1.1.0}
    env_file:
      - path: .env.accommodation
        required: false
    mem_limit: 768m
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/accommodation/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - accommodation_prod_net
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /accommodation/prod
        awslogs-stream: backend

  frontend:
    image: ${FRONTEND_IMAGE:-prchandan6666/accommodation-frontend}:${IMAGE_TAG:-v1.1.0}
    volumes:
      - ./nginx.accommodation.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - accommodation_prod_net
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /accommodation/prod
        awslogs-stream: frontend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - accommodation_prod_net
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /accommodation/prod
        awslogs-stream: caddy

networks:
  accommodation_prod_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
